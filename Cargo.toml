[package]
name = "dotai"
version = "0.3.0"
edition = "2021"
description = "Generate AGENTS.md and Claude, Cursor, and OpenCode config from a single .ai/ source directory"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
